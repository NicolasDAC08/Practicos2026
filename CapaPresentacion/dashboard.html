<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Gestión de Productos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        header { background: #333; color: white; padding: 15px 20px; display: flex; justify-content: space-between; }
        header a { color: #ff6b6b; text-decoration: none; }
        .container { padding: 20px; max-width: 1000px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 12px; text-align: left; }
        th { background-color: #0056b3; color: white; }
        .form-panel { background: white; padding: 20px; margin-bottom: 20px; box-shadow: 0px 0px 5px rgba(0,0,0,0.1); }
        .form-panel input { padding: 8px; margin-right: 10px; }
        .btn-add { background: #28a745; color: white; border: none; padding: 9px 15px; cursor: pointer; }
        .btn-edit { background: #ffc107; color: black; border: none; padding: 5px 10px; text-decoration: none; font-size: 0.9em; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 5px 10px; text-decoration: none; font-size: 0.9em; }
    </style>
</head>
<body>

    <header>
        <div>Bienvenido, <strong><!-- Nombre del usuario logueado aquí --></strong></div>
        <a href="C:\xampp\htdocs\Practicos2026\CapaLogica\controlador_logout.php" >Cerrar Sesión</a>
    </header>

    <div class="container">
        <h2>Gestión de Inventario</h2>

        <!-- Panel de Altas y Modificaciones -->
        <div class="form-panel">
            <form action="C:\xampp\htdocs\Practicos2026\CapaLogica\controlador_producto.php" method="POST">
                <input type="hidden" name="id_producto" value="">
                <input type="text" name="nombre" placeholder="Nombre del producto" required>
                <input type="number" step="0.01" name="precio" placeholder="Precio" required>
                <input type="number" name="stock" placeholder="Stock inicial" required>
                <!-- El estudiante debe manejar la acción según si es Alta o Modificación -->
                <button type="submit" name="accion" value="guardar" class="btn-add">Guardar Producto</button>
            </form>
        </div>

        <!-- Listado de Consulta (Lectura) -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Este bloque debe ser iterado dinámicamente con PHP consultando la capa de lógica -->
                <tr>
                    <td>1</td>
                    <td>Producto de Ejemplo</td>
                    <td>$99.99</td>
                    <td>15</td>
                    <td>
                        <a href="C:\xampp\htdocs\Practicos2026\CapaPresentacion\dashboard.php?edit_id=1" class="btn-edit">Editar</a>
                        <form action="C:\xampp\htdocs\Practicos2026\CapaLogica\controlador_producto.php" method="POST" style="display:inline;">
                            <input type="hidden" name="id_producto" value="1">
                            <button type="submit" name="accion" value="eliminar" class="btn-delete" onclick="return confirm('¿Eliminar producto?');">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <!-- Fin del bloque iterativo -->
            </tbody>
        </table>
    </div>

</body>
</html>
